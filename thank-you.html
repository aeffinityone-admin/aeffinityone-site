<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank You - Æffinityone</title>
  <link rel="stylesheet" href="styles.css" />

  <style>
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
    }

    .wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #111;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.08);
      text-align: center;
    }

    h1 {
      color: gold;
      margin-bottom: 12px;
      font-size: 30px;
    }

    p {
      color: #aaa;
      line-height: 1.75;
      margin-bottom: 24px;
    }

    a {
      display: inline-block;
      padding: 14px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      background: gold;
      color: #000;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <h1>Thank You</h1>
      <p>
        Your submission was received successfully. If there’s a fit, we’ll follow up directly.
      </p>
      <a href="index.html">Back to Æffinityone</a>
    </div>
  </div>
</body>
</html>
